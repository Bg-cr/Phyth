name: "Feature or Enhancement"
description: "Suggest an idea or improvement for this project"
labels: ["enhancement"]

body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting your request
      options:
        - label: I have searched through existing issues and discussions to ensure this hasn't been requested before
          required: true
        - label: I have read the README and documentation to understand current capabilities
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see
      placeholder: "I would like to be able to..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions
      description: Describe any alternative solutions or features you've considered
      placeholder: "Have you considered other approaches?"

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or examples about the feature request here

  - type: textarea
    id: impact
    attributes:
      label: Academic or Scientific Impact
      description: How would this feature enable new research or improve reproducibility?
      placeholder: "This would allow us to simulate..."

  - type: markdown
    attributes:
      value: "> Even if you're not sure about the implementation, we welcome discussion."

  - type: dropdown
    id: intention
    attributes:
      label: Do you plan to implement this yourself?
      description: This helps us understand if we should wait for your PR or pick it up ourselves
      options:
        - "Yes, I plan to implement it and submit a PR"
        - "No, I don't have plans to implement it"
        - "Not sure, I'd like to discuss feasibility first"
    validations:
      required: true

  - type: input
    id: pr-link
    attributes:
      label: Pull Request Link (Optional)
      description: If you've already started working on this, please link your PR here